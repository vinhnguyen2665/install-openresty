# 1. Bóc tách và chuyển đổi ngày (YYYY-MM-DD) => (YYYY/MM/DD)
map $time_iso8601 $log_date {
    "~^(?<year>\d{4})-(?<month>\d{2})-(?<day>\d{2})T"  "${year}/${month}/${day}";
}
# 2. Bóc tách phần giờ (HH:MM:SS)
map $time_iso8601 $log_time {
    "~T(?<time>\d{2}:\d{2}:\d{2})"  "$time";
}
# 3. Bóc tách phần múi giờ (Bỏ dấu hai chấm)
map $time_iso8601 $log_timezone {
    "~\+(?<tz_h>\d{2}):(?<tz_m>\d{2})$"  "+${tz_h}${tz_m}";
    "~\-(?<tz_h>\d{2}):(?<tz_m>\d{2})$"  "-${tz_h}${tz_m}";
}
