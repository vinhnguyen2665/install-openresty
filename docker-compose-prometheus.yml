services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - metrics-net

networks:
  metrics-net:
    name: openresty-metrics-net
    external: true
