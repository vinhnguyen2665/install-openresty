# -------------------------------------------------------------
# 1. BƯỚC KIỂM TRA & RATE LIMIT TẠI ACCESS PHASE
# -------------------------------------------------------------
access_by_lua_block {
    local limit_req = require "resty.limit.req"
    local client_ip = ngx.var.remote_addr

    -- A. Kiểm tra IP Blacklist
    local blacklist = ngx.shared.ip_blacklist
    if blacklist and blacklist:get(client_ip) then
        ngx.log(ngx.WARN, "[SECURITY ALERT] Blocked blacklisted IP: ", client_ip)
        if metric_security then metric_security:inc(1, {"blacklist_blocked", "403"}) end
        ngx.exit(ngx.HTTP_FORBIDDEN)
    end

    -- B. Kiểm tra Rate Limit
    local lim, err = limit_req.new("rate_limit_store", 50, 30)
    if lim then
        local delay, err = lim:incoming(client_ip, true)
        if not delay and err == "rejected" then
            ngx.log(ngx.WARN, "[RATE LIMIT ALERT] IP flooded: ", client_ip)
            if metric_security then metric_security:inc(1, {"rate_limit_flood", "429"}) end
            ngx.exit(429)
        elseif delay and delay >= 0.001 then
            ngx.sleep(delay)
        end
    end
}

# -------------------------------------------------------------
# 2. BƯỚC PHÂN TÍCH HÀNH VI & GHI NHẬN METRICS TẠI LOG PHASE
# -------------------------------------------------------------
log_by_lua_block {
    local client_ip = ngx.var.remote_addr
    local status = tonumber(ngx.var.status)
    local target_host = ngx.var.host or ngx.var.server_name

    -- A. Phân tích tấn công / scan dò quét
    local violations = ngx.shared.violation_tracker
    local blacklist = ngx.shared.ip_blacklist

    if violations and blacklist and (status == 404 or status == 429 or status == 401) then
        local current_score, err = violations:incr(client_ip, 1, 0, 60)
        if current_score and current_score >= 20 then
            blacklist:set(client_ip, true, 600)
            ngx.log(ngx.ALERT, "[SECURITY ALERT] AUTO-BANNED: ", client_ip, " (Score: ", current_score, ")")
            if metric_security then metric_security:inc(1, {"auto_banned", tostring(status)}) end
        end
    end

    -- B. Ghi nhận Metrics Prometheus (Không bị ghi đè hay mất dữ liệu)
    if metric_requests then
        metric_requests:inc(1, {target_host, tostring(status)})
    end
    if metric_latency and ngx.var.request_time then
        metric_latency:observe(tonumber(ngx.var.request_time), {target_host})
    end
}